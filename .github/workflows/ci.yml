name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Check hardcoding
        run: ./scripts/check-hardcoding.sh

      - name: Test check-hardcoding script
        run: ./scripts/test-check-hardcoding.sh

      - name: Validate instances
        run: pnpm instance:validate

      - name: Build landings
        run: pnpm instance:build ec-es && pnpm --filter landings build

      - name: Build functions
        run: pnpm --filter functions build

      - name: Import @tla/shared with plain Node
        working-directory: functions
        run: node scripts/check-shared-import.mjs

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.34.2

      - name: Seed against Firestore emulator
        run: pnpm --filter @tla/instance-cli test:emulator

      - name: Landing lead ingestion against Firestore emulator
        run: pnpm --filter functions test:emulator
