# Instancia ec-es: receptivo en Ecuador captando viajeros en España.
# Contexto de negocio: instances/ec-es/README.md
# Valores marcados TODO se completan en M0 (ver docs/10-roadmap.md).

id: ec-es
name: "Ecuador desde España"    # TODO: nombre comercial definitivo
status: draft

agency:
  slug: agencia-ec              # TODO: slug de la agencia
  legalName: "Agencia receptiva de demostración (ficticia)" # FICTICIO: solo demo, sustituir por el de la agencia (#23)
  country: EC
  website: ""                   # TODO
  notify:
    channel: email
    target: secret:AGENCY_NOTIFY_TARGET   # direcciones de los destinatarios, separadas por comas

partner:
  legalName: ""                 # TODO: autónomo del socio en España
  country: ES

destination:
  country: EC

market:
  country: ES                   # es-ES, EUR, Europe/Madrid y región ES vienen del pack
  businessHours:
    start: "09:00"
    end: "21:00"
    days: [1, 2, 3, 4, 5, 6]

brand:
  displayName: "Ecuador Vivo (demo)"  # TODO: marca provisional de demo, pendiente de la agencia (#23)
  domain: ""
  logo: "/media/logo-demo.svg"   # TODO: logo provisional de demo, pendiente de la agencia (#23)
  primaryColor: "#C8450D"  # TODO: color provisional de demo (naranja volcánico, 4,87:1 con blanco), pendiente de la agencia (#23)

infra:
  firebaseProjects:
    dev: tla-ec-es-dev          # TODO: confirmar IDs disponibles
    prod: tla-ec-es-prod
  region: europe-southwest1
  bigqueryLocation: EU

channels:
  crm:
    provider: hubspot           # TODO: confirmar con la agencia (ADR pendiente)
    tokenSecret: secret:CRM_API_TOKEN
  whatsapp:
    bsp: meta_cloud             # Cloud API de Meta (ADR 0007)
    number: "+34600000000"      # FICTICIO: solo demo, sustituir por el de la agencia (#23) — línea española dedicada (+34)
    webhookSecret: secret:WHATSAPP_BSP_WEBHOOK_SECRET
  email:
    from: ""                    # TODO: remitente del dominio de la instancia
    smtpSecret: secret:SMTP_CONNECTION_URI
  meta:
    pixelId: ""
    adAccountId: ""
    pageId: ""
    capiTokenSecret: secret:META_CAPI_ACCESS_TOKEN
    pageTokenSecret: secret:META_PAGE_ACCESS_TOKEN
    leadForm:
      fieldMap:
        cuando_quieres_viajar:  # «¿Cuándo quieres viajar?» (ejemplo; ajustar al formulario real)
          field: travelMonth
          values:
            marzo_2027: "2027-03"
            abril_2027: "2027-04"
            mayo_2027: "2027-05"
  web:                          # claves públicas de la app web de Firebase (formulario de lead)
    recaptchaSiteKey: ""        # TODO: clave de sitio de reCAPTCHA Enterprise (App Check)
    firebaseApiKey: ""          # TODO: apiKey de la app web de Firebase
    firebaseAppId: ""           # TODO: appId de la app web de Firebase (1:<n>:web:<hex>)
  gtmId: ""
  ga4MeasurementId: ""

segments:
  - id: adventure
    label: "Aventura y naturaleza"
  - id: couple
    label: "Parejas y luna de miel"
  - id: senior
    label: "Sénior activo"
  - id: diaspora
    label: "Diáspora ecuatoriana"

pricing:
  budgetRanges: ["<2000", "2000-4000", "4000-6000", ">6000"]

sla:
  warnAfterMinutes: 10
  breachAfterMinutes: 30

compliance:
  dataRetentionMonths: 24
  legalTextsVersion: ""         # TODO: tras revisión del abogado
  internationalTransfer: scc    # Ecuador sin decisión de adecuación de la UE

commission:
  model: fee_plus_commission
  rate: 0                       # TODO: según contrato con la agencia

agents:
  qualification:
    enabled: true
    mode: assisted
  proposal:
    enabled: false
  persona:
    name: ""                    # TODO

features:
  mcpCatalog: false
